name: HotelHIIT
options:
  bundleIdPrefix: com.skawamura
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  HotelHIIT:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HotelHIIT Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skawamura.HotelHIIT
        PRODUCT_NAME: HotelHIIT
        INFOPLIST_FILE: HotelHIIT Watch App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hotel HIIT
        INFOPLIST_KEY_WKWatchOnly: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
schemes:
  HotelHIIT:
    build:
      targets:
        HotelHIIT: all
    run:
      config: Debug
      executable: HotelHIIT
